name: Robot Flow Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node scripts/verify-native.mjs
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: chmod +x gradlew && ./gradlew assembleDebug lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: RobotFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
