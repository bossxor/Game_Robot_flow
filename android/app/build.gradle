plugins { id 'com.android.application' }

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

android {
    namespace 'com.bossxor.robotflow'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bossxor.roborelay'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }
    signingConfigs {
        roboRelay {
            storeFile rootProject.file('keystore/robo-relay.jks')
            storePassword keystoreProps.getProperty('storePassword', 'RoboRelay0.1')
            keyAlias keystoreProps.getProperty('keyAlias', 'robo-relay')
            keyPassword keystoreProps.getProperty('keyPassword', 'RoboRelay0.1')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            signingConfig signingConfigs.roboRelay
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.roboRelay
        }
    }
}

// The native renderer consumes only level data. No web runtime is packaged.
def syncGameAssets = tasks.register('syncGameAssets', Sync) {
    from('../../public/construction-levels') { into 'levels' }
    from('../../fonts') { into 'fonts' }
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn syncGameAssets }
