plugins { id 'com.android.application' }

android {
    namespace 'com.bossxor.robotflow'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bossxor.robotflow'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '0.9.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
}

// The native renderer consumes only level data. No web runtime is packaged.
def syncGameAssets = tasks.register('syncGameAssets', Sync) {
    from('../../public/construction-levels') { into 'levels' }
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn syncGameAssets }
